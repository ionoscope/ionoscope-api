name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag ionoscope-api:ci .
      - name: Check the container does not run as root
        run: test "$(docker run --rm ionoscope-api:ci id -u)" = 10001
      - name: Check a fresh volume is writable
        run: docker run --rm --volume probe:/app/forecast_cache ionoscope-api:ci touch /app/forecast_cache/probe
      - name: Check the service starts
        run: |
          set -euo pipefail
          docker run --detach --name service --publish 8000:8000 ionoscope-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs service
          exit 1
